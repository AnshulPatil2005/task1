<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Four Section Diagonal Layout</title>

<style>
    /* Remove default spacing */
    body {
        margin: 0;
        height: 100vh;
        overflow: hidden;
        font-family: Arial, sans-serif;
    }

    /* Main container */
    .container {
        position: relative;
        width: 100%;
        height: 100vh;
    }

    /* Base styling for all sections */
    .section {
        position: absolute;
        width: 100%;
        height: 100%;
        transition: 0.4s ease;
        cursor: pointer;
    }

    /* SECTION COLORS - Rotated 5° clockwise */

    /* Top Left */
    .section1 {
        background: #ffd6e7; /* Light pink */
        clip-path: polygon(0 0, 45.6% 0, 50% 50%, 0 54.4%);
    }

    /* Top Right */
    .section2 {
        background: #c9f7d9; /* Light green */
        clip-path: polygon(45.6% 0, 100% 0, 100% 45.6%, 50% 50%);
    }

    /* Bottom Left */
    .section3 {
        background: #e6e6e6; /* Light gray */
        clip-path: polygon(0 54.4%, 50% 50%, 54.4% 100%, 0 100%);
    }

    /* Bottom Right */
    .section4 {
        background: #3f5f4f; /* Dark green-gray */
        clip-path: polygon(50% 50%, 100% 45.6%, 100% 100%, 54.4% 100%);
    }

    /* Text Branding */
    .branding {
        position: fixed;
        top: 40px;
        left: 80px;
        z-index: 100;
        color: white;
        pointer-events: none;
    }

    .equals {
        font-size: 48px;
        font-weight: 300;
        margin-bottom: 5px;
    }

    .projects-text {
        font-size: 24px;
        font-weight: 300;
        letter-spacing: 1px;
    }

    /* Delve Text */
    .delve-container {
        position: fixed;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 50;
        pointer-events: none;
        display: flex;
        font-size: 160px;
        font-weight: 300;
        color: rgba(0, 0, 0, 0.2);
        letter-spacing: -8px;
        font-style: italic;
    }

    .delve-container span {
        display: inline-block;
    }

    /* Letter clips */
    .delve-container span:nth-child(2) {
        /* e - 10% cut from bottom */
        clip-path: polygon(0 0, 100% 0, 100% 90%, 0 90%);
    }

    .delve-container span:nth-child(3) {
        /* l - small cut from bottom */
        clip-path: polygon(0 0, 100% 0, 100% 95%, 0 95%);
    }

    .delve-container span:nth-child(4),
    .delve-container span:nth-child(5) {
        /* v and e - small cut from top */
        clip-path: polygon(0 8%, 100% 8%, 100% 100%, 0 100%);
    }

    /* Image overlay */
    .overlay {
        position: absolute;
        inset: 0;
        background-size: cover;
        background-position: center;
        opacity: 0;
        transition: 0.4s ease;
    }

    /* Hover effect */
    .section:hover .overlay {
        opacity: 1;
    }

</style>
</head>

<body>

<div class="branding">
    <div class="equals">=</div>
    <div class="projects-text">Projects</div>
</div>

<div class="delve-container">
    <span>d</span>
    <span>e</span>
    <span>l</span>
    <span>v</span>
    <span>e</span>
</div>

<div class="container">

    <div class="section section1">
        <div class="overlay" style="background-image: url('https://picsum.photos/800/600?random=1');"></div>
    </div>

    <div class="section section2">
        <div class="overlay" style="background-image: url('https://picsum.photos/800/600?random=2');"></div>
    </div>

    <div class="section section3">
        <div class="overlay" style="background-image: url('https://picsum.photos/800/600?random=3');"></div>
    </div>

    <div class="section section4">
        <div class="overlay" style="background-image: url('https://picsum.photos/800/600?random=4');"></div>
    </div>

</div>

</body>
</html>
